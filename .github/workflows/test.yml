name: Unit Test (vitest)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Cache Angular
        uses: actions/cache@v5
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-angular-

      - name: Install dependencies
        run: npm ci

      - name: Prepare test stub (images.json is gitignored; copy committed stub)
        run: |
          mkdir -p src/assets/generated
          cp src/testing/images-stub.json src/assets/generated/images.json

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests (vitest / jsdom)
        run: npm run test -- --watch=false
